<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piccadely · Regalos empresariales</title>
<meta name="robots" content="noindex">
<!-- El cotizador de regalos ahora vive en la página única (/cotizador.html?tipo=regalos). Esta ruta queda para no romper
     links ya publicados: redirige conservando la query (?api=, utm_…) y el #hash. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  q.set("tipo", "regalos");
  location.replace("/cotizador.html?" + q.toString() + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/cotizador.html?tipo=regalos"></noscript>
</head>
<body>
<p><a href="/cotizador.html?tipo=regalos">Ir al cotizador de regalos de Piccadely</a></p>
</body>
</html>
